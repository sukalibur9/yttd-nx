; Your Turn To Die on Switch (nx.js)
; The game's database (notably the 7-8 MB CommonEvents JSONs) needs more V8
; heap than the computed default during loading. 512 MiB is the runtime max;
; if the backable ceiling is lower the runtime clamps and logs it.
[memory]
heap_limit = 512 MiB

[v8]
; The game uses no WebAssembly. Dropping the 64 MiB WASM code headroom frees
; arena space that native allocations (image/audio decode) need.
wasm = off
; Lets the loader force major GCs at scene transitions to hand pages back
; to the native allocator.
flags = --expose-gc

; Keep Skia's GPU resource cache small - this game is 2D canvas and does not
; need hundreds of MB of GPU resources. Frees native memory headroom.
[renderer]
gpu_cache = 128
